<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BASE: makes all relative URLs resolve from site root -->
  <base href="/">

  <!-- SEO -->
  <title>RangLoop — Your vibe deserves better than mass production</title>
  <meta name="description"
    content="Browse RangLoop's product catalog — premium custom-printed tees, hoodies, caps, mugs and coasters. Order via Instagram DM.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- Open Graph (for Instagram / WhatsApp link previews) -->
  <meta property="og:title" content="RangLoop">
  <meta property="og:description" content="Your vibe deserves better than mass production.">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="css/style.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

  <!-- ======================================================
       HEADER
       ====================================================== -->
  <header class="site-header" role="banner">
    <div class="header-brand">
      <a href="/shop/" class="wordmark" aria-label="RangLoop — home">
        <img src="images/logo/logo.png" alt="RangLoop" class="site-logo">
      </a>
      <p class="tagline">Your vibe deserves better than mass production.</p>
    </div>

    <div class="header-actions">
      <a href="https://www.instagram.com/rangloop2026" target="_blank" rel="noopener noreferrer" class="ig-link"
        aria-label="RangLoop on Instagram">
        <!-- Instagram icon (inline SVG, no external file needed) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
          <circle cx="12" cy="12" r="4.5" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
        @rangloop2026
      </a>
    </div>
  </header>



  <!-- ======================================================
       PRODUCT GRID
       (populated dynamically by main.js)
       ====================================================== -->
  <main class="catalog-section" role="main">
    <div class="product-grid" id="product-grid" aria-label="Product catalog">
      <!-- Cards are injected here by main.js -->
    </div>
  </main>

  <!-- ======================================================
       FOOTER
       ====================================================== -->
  <footer class="site-footer" role="contentinfo">
    <p class="footer-copy">Made with care.</p>
    <a href="https://www.instagram.com/rangloop2026" target="_blank" rel="noopener noreferrer" class="footer-ig"
      aria-label="RangLoop on Instagram">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
        <circle cx="12" cy="12" r="4.5" />
        <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
      </svg>
      @rangloop2026
    </a>
  </footer>

  <!-- ======================================================
       SCRIPTS
       Load products.js first so products[] is available to main.js
       ====================================================== -->
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
